<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0D0D0D"/><stop offset="100%" style="stop-color:#1a1a1a"/></linearGradient>
    <pattern id="carbon" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect width="20" height="20" fill="#111"/>
      <rect x="0" y="0" width="10" height="10" fill="#1a1a1a"/>
      <rect x="10" y="10" width="10" height="10" fill="#1a1a1a"/>
    </pattern>
    <filter id="sh"><feDropShadow dx="4" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <g transform="translate(200,200) rotate(-8) translate(-160,-200)" filter="url(#sh)">
    <rect x="0" y="0" width="320" height="400" rx="28" fill="url(#carbon)"/>
    <rect x="6" y="6" width="308" height="388" rx="24" fill="url(#carbon)" opacity="0.9"/>
    <rect x="20" y="20" width="80" height="80" rx="16" fill="#0D0D0D" stroke="#333" stroke-width="0.5"/>
    <circle cx="45" cy="45" r="14" fill="#111" stroke="#444" stroke-width="1"/>
    <circle cx="75" cy="45" r="10" fill="#111" stroke="#444" stroke-width="1"/>
    <circle cx="45" cy="75" r="6" fill="#111" stroke="#444" stroke-width="1"/>
    <text x="160" y="210" text-anchor="middle" fill="#D4AF37" font-size="14" font-family="Georgia, serif" opacity="0.4">CASELÉ</text>
  </g>
</svg>
