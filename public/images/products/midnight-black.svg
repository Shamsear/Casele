<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" fill="#0D0D0D"/>
  <!-- Phone case shape -->
  <rect x="120" y="40" width="160" height="320" rx="24" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="2"/>
  <!-- Camera bump -->
  <rect x="140" y="60" width="50" height="50" rx="12" fill="#2A2A2A"/>
  <circle cx="155" cy="75" r="8" fill="#333"/>
  <circle cx="175" cy="75" r="8" fill="#333"/>
  <circle cx="155" cy="95" r="8" fill="#333"/>
  <!-- Gold accent line -->
  <rect x="140" y="180" width="120" height="1" fill="#D4AF37" opacity="0.6"/>
  <!-- Crown monogram -->
  <text x="200" y="220" text-anchor="middle" font-family="serif" font-size="32" fill="#D4AF37" opacity="0.4">É</text>
  <!-- Brand text -->
  <text x="200" y="300" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#D4AF37" letter-spacing="4" opacity="0.5">CASELÉ</text>
</svg>
