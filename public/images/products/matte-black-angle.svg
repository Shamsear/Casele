<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0D0D0D"/><stop offset="100%" style="stop-color:#1a1a1a"/></linearGradient>
    <linearGradient id="armor" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#111"/><stop offset="50%" style="stop-color:#0D0D0D"/><stop offset="100%" style="stop-color:#1a1a1a"/></linearGradient>
    <filter id="sh"><feDropShadow dx="4" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <g transform="translate(200,200) rotate(-8) translate(-160,-200)" filter="url(#sh)">
    <!-- Reinforced corners -->
    <rect x="-4" y="-4" width="328" height="408" rx="32" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <rect x="0" y="0" width="320" height="400" rx="28" fill="url(#armor)"/>
    <rect x="6" y="6" width="308" height="388" rx="24" fill="#111" opacity="0.9"/>
    <!-- Armor lines -->
    <line x1="20" y1="120" x2="300" y2="120" stroke="#222" stroke-width="1"/>
    <line x1="20" y1="280" x2="300" y2="280" stroke="#222" stroke-width="1"/>
    <rect x="20" y="20" width="80" height="80" rx="16" fill="#0D0D0D" stroke="#333" stroke-width="1"/>
    <circle cx="45" cy="45" r="14" fill="#111" stroke="#444" stroke-width="1.5"/>
    <circle cx="75" cy="45" r="10" fill="#111" stroke="#444" stroke-width="1.5"/>
    <circle cx="45" cy="75" r="6" fill="#111" stroke="#444" stroke-width="1.5"/>
    <text x="160" y="210" text-anchor="middle" fill="#D4AF37" font-size="14" font-family="Georgia, serif" opacity="0.4">CASELÉ</text>
  </g>
</svg>
