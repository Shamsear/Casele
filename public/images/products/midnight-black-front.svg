<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800">
  <defs>
    <filter id="shadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="50%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0f0f0f"/>
    </linearGradient>
    <linearGradient id="gloss" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.12"/>
      <stop offset="30%" stop-color="white" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="innerShadow">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="table" tableValues="1 0"/>
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000" flood-opacity="0.4" result="color"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode/>
      </feMerge>
    </filter>
  </defs>

  <!-- Case body (slightly larger than phone) -->
  <rect x="52" y="32" width="296" height="736" rx="52" ry="52" 
        fill="url(#caseGrad)" filter="url(#shadow)"/>
  
  <!-- Case edge detail -->
  <rect x="52" y="32" width="296" height="736" rx="52" ry="52" 
        fill="none" stroke="#333" stroke-width="1" opacity="0.5"/>

  <!-- Screen area (reveals phone screen) -->
  <rect x="64" y="48" width="272" height="704" rx="42" ry="42" 
        fill="#000" filter="url(#innerShadow)"/>

  <!-- Dynamic Island -->
  <rect x="152" y="60" width="96" height="28" rx="14" ry="14" 
        fill="#1a1a1a"/>

  <!-- Camera module cutout -->
  <rect x="68" y="52" width="88" height="88" rx="22" ry="22" 
        fill="#111" stroke="#222" stroke-width="1"/>
  <circle cx="98" cy="82" r="15" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="2"/>
  <circle cx="98" cy="82" r="9" fill="#080818"/>
  <circle cx="98" cy="82" r="3.5" fill="#12122a" opacity="0.7"/>
  <circle cx="132" cy="82" r="15" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="2"/>
  <circle cx="132" cy="82" r="9" fill="#080818"/>
  <circle cx="132" cy="82" r="3.5" fill="#12122a" opacity="0.7"/>
  <circle cx="98" cy="116" r="15" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="2"/>
  <circle cx="98" cy="116" r="9" fill="#080818"/>
  <circle cx="98" cy="116" r="3.5" fill="#12122a" opacity="0.7"/>
  <circle cx="132" cy="116" r="7" fill="#222"/>

  <!-- Side buttons (case buttons) -->
  <rect x="48" y="180" width="6" height="64" rx="3" fill="#333"/>
  <rect x="48" y="280" width="6" height="104" rx="3" fill="#333"/>
  <rect x="48" y="420" width="6" height="104" rx="3" fill="#333"/>
  <rect x="346" y="300" width="6" height="144" rx="3" fill="#333"/>

  <!-- Matte texture overlay -->
  <rect x="52" y="32" width="296" height="736" rx="52" ry="52" 
        fill="url(#gloss)" opacity="0.8"/>

  <!-- Subtle CASELE branding on case -->
  <text x="200" y="720" text-anchor="middle" 
        font-family="serif" font-size="10" fill="#333" letter-spacing="4" opacity="0.4">
    CASELE
  </text>
</svg>
