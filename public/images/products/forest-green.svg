<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" fill="none">
  <defs>
    <filter id="greenShadow" x="60" y="490" width="280" height="90" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.05   0 0 0 0 0.25   0 0 0 0 0.15  0 0 0 0.25 0"/>
    </filter>

    <linearGradient id="emeraldLeather" x1="100" y1="50" x2="300" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14532D"/>
      <stop offset="50%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>

    <linearGradient id="goldAcc" x1="100" y1="50" x2="300" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DFCA9B"/>
      <stop offset="100%" stop-color="#C5A869"/>
    </linearGradient>
  </defs>

  <!-- Ground Drop Shadow -->
  <ellipse cx="200" cy="535" rx="100" ry="18" fill="#022C22" filter="url(#greenShadow)" />

  <!-- Outer Bumper -->
  <rect x="95" y="45" width="210" height="470" rx="42" fill="#064E3B" stroke="#047857" stroke-width="1.5"/>

  <!-- Inner Body with Deep Emerald Grain -->
  <rect x="100" y="50" width="200" height="460" rx="38" fill="url(#emeraldLeather)"/>

  <!-- Leather Perimeter Stitching -->
  <rect x="106" y="56" width="188" height="448" rx="34" fill="none" stroke="#10B981" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.35"/>

  <!-- Buttons -->
  <rect x="91" y="125" width="4" height="26" rx="2" fill="url(#goldAcc)"/>
  <rect x="91" y="165" width="4" height="42" rx="2" fill="url(#goldAcc)"/>
  <rect x="91" y="215" width="4" height="42" rx="2" fill="url(#goldAcc)"/>
  <rect x="305" y="170" width="4" height="54" rx="2" fill="url(#goldAcc)"/>

  <!-- Camera Bump Island with Gold Ring Bezel -->
  <rect x="115" y="65" width="95" height="100" rx="26" fill="#022C22" stroke="url(#goldAcc)" stroke-width="2"/>

  <!-- Lenses -->
  <circle cx="145" cy="95" r="17" fill="#022C22" stroke="url(#goldAcc)" stroke-width="1.8"/>
  <circle cx="145" cy="95" r="11" fill="#064E3B"/>
  <circle cx="146" cy="94" r="1.5" fill="#FFFFFF" opacity="0.9"/>

  <circle cx="145" cy="135" r="17" fill="#022C22" stroke="url(#goldAcc)" stroke-width="1.8"/>
  <circle cx="145" cy="135" r="11" fill="#064E3B"/>
  <circle cx="146" cy="134" r="1.5" fill="#FFFFFF" opacity="0.9"/>

  <circle cx="185" cy="115" r="17" fill="#022C22" stroke="url(#goldAcc)" stroke-width="1.8"/>
  <circle cx="185" cy="115" r="11" fill="#064E3B"/>
  <circle cx="186" cy="114" r="1.5" fill="#FFFFFF" opacity="0.9"/>

  <!-- Flash & Sensor -->
  <circle cx="185" cy="85" r="6" fill="#FFFBEB" stroke="url(#goldAcc)" stroke-width="1"/>
  <circle cx="185" cy="145" r="4.5" fill="#000000"/>

  <!-- Brand Typography -->
  <text x="200" y="440" text-anchor="middle" font-family="serif" font-size="15" font-weight="600" fill="url(#goldAcc)" letter-spacing="2">CASELÉ</text>
  <text x="200" y="456" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="500" fill="url(#goldAcc)" opacity="0.75" letter-spacing="3">FOREST LEATHER</text>
</svg>
