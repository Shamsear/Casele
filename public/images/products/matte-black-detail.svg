<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0D0D0D"/><stop offset="100%" style="stop-color:#111"/></linearGradient>
  </defs>
  
  <g transform="translate(30,50) scale(1.15)">
    <!-- Reinforced corner detail -->
    <rect x="0" y="0" width="300" height="260" rx="22" fill="#0D0D0D" stroke="#333" stroke-width="1.5"/>
    <!-- Corner reinforcement -->
    <path d="M0,30 Q0,0 30,0" fill="none" stroke="#444" stroke-width="3"/>
    <path d="M270,0 Q300,0 300,30" fill="none" stroke="#444" stroke-width="3"/>
    <path d="M300,230 Q300,260 270,260" fill="none" stroke="#444" stroke-width="3"/>
    <path d="M30,260 Q0,260 0,230" fill="none" stroke="#444" stroke-width="3"/>
    <!-- Armor texture -->
    <line x1="20" y1="80" x2="280" y2="80" stroke="#222" stroke-width="1"/>
    <line x1="20" y1="180" x2="280" y2="180" stroke="#222" stroke-width="1"/>
  </g>
  <text x="200" y="370" text-anchor="middle" fill="#A89B8C" font-size="11" font-family="Inter, sans-serif" letter-spacing="2">REINFORCED CORNERS</text>
</svg>
