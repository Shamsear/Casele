    <pattern id="cf" patternUnits="userSpaceOnUse" width="16" height="16">
      <rect width="16" height="16" fill="#111"/>
      <rect x="0" y="0" width="8" height="8" fill="#1a1a1a"/>
      <rect x="8" y="8" width="8" height="8" fill="#1a1a1a"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <g transform="translate(30,50) scale(1.15)">
    <rect x="0" y="0" width="300" height="260" rx="18" fill="url(#cf)" stroke="#333" stroke-width="0.5"/>
    <line x1="0" y1="130" x2="300" y2="130" stroke="#D4AF37" stroke-width="1.5" opacity="0.3"/>
    <text x="150" y="250" text-anchor="middle" fill="#A89B8C" font-size="10" font-family="Inter, sans-serif" letter-spacing="1">CARBON FIBER WEAVE</text>
