<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D0D"/>
      <stop offset="100%" style="stop-color:#111"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg2)"/>
  <!-- Close-up of corner/texture -->
  <g transform="translate(50,30) scale(1.2)">
    <rect x="0" y="0" width="280" height="280" rx="20" fill="#0D0D0D" stroke="#222" stroke-width="0.5"/>
    <!-- Texture lines -->
    <line x1="20" y1="40" x2="260" y2="40" stroke="#1a1a1a" stroke-width="0.5"/>
    <line x1="20" y1="60" x2="260" y2="60" stroke="#1a1a1a" stroke-width="0.5"/>
    <line x1="20" y1="80" x2="260" y2="80" stroke="#1a1a1a" stroke-width="0.5"/>
    <line x1="20" y1="100" x2="260" y2="100" stroke="#1a1a1a" stroke-width="0.5"/>
    <line x1="20" y1="120" x2="260" y2="120" stroke="#1a1a1a" stroke-width="0.5"/>
    <line x1="20" y1="140" x2="260" y2="140" stroke="#1a1a1a" stroke-width="0.5"/>
    <line x1="20" y1="160" x2="260" y2="160" stroke="#1a1a1a" stroke-width="0.5"/>
    <line x1="20" y1="180" x2="260" y2="180" stroke="#1a1a1a" stroke-width="0.5"/>
    <!-- Gold accent line -->
    <line x1="20" y1="140" x2="260" y2="140" stroke="#D4AF37" stroke-width="1" opacity="0.3"/>
    <!-- Corner detail -->
    <path d="M20,20 Q20,0 40,0" fill="none" stroke="#222" stroke-width="1"/>
  </g>
  <!-- Label -->
  <text x="200" y="360" text-anchor="middle" fill="#A89B8C" font-size="11" font-family="Inter, sans-serif" letter-spacing="2">PREMIUM MATTE FINISH</text>
</svg>
