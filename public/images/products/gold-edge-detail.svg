<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D0D"/>
      <stop offset="100%" style="stop-color:#111"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B8941E"/>
      <stop offset="50%" style="stop-color:#E8D5A3"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>
  
  <!-- Close-up of gold edge detail -->
  <g transform="translate(30,60) scale(1.1)">
    <rect x="0" y="0" width="300" height="280" rx="20" fill="#1a1a1a" stroke="url(#gold)" stroke-width="3"/>
    <!-- Gold edge highlight -->
    <rect x="0" y="0" width="300" height="280" rx="20" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.5"/>
    <!-- Texture -->
    <line x1="20" y1="40" x2="280" y2="40" stroke="#222" stroke-width="0.5"/>
    <line x1="20" y1="70" x2="280" y2="70" stroke="#222" stroke-width="0.5"/>
    <line x1="20" y1="100" x2="280" y2="100" stroke="#222" stroke-width="0.5"/>
    <line x1="20" y1="130" x2="280" y2="130" stroke="#222" stroke-width="0.5"/>
    <!-- Gold accent line -->
    <line x1="0" y1="140" x2="300" y2="140" stroke="url(#gold)" stroke-width="2" opacity="0.4"/>
  </g>
  <text x="200" y="370" text-anchor="middle" fill="#D4AF37" font-size="11" font-family="Georgia, serif" letter-spacing="2">GOLD PLATED ACCENTS</text>
</svg>
