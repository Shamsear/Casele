<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" fill="none">
  <defs>
    <filter id="pinkShadow" x="60" y="490" width="280" height="90" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.8   0 0 0 0 0.5   0 0 0 0 0.6  0 0 0 0.25 0"/>
    </filter>

    <linearGradient id="blushBody" x1="100" y1="50" x2="300" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCE7F3" />
      <stop offset="50%" stop-color="#FBCFE8" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <pattern id="lacePattern" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="8" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.45"/>
      <circle cx="14" cy="14" r="4" fill="#FFFFFF" fill-opacity="0.3"/>
      <path d="M0 14 Q 7 7, 14 14 T 28 14" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.35"/>
      <path d="M14 0 Q 7 7, 14 14 T 14 28" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Ground Drop Shadow -->
  <ellipse cx="200" cy="535" rx="100" ry="18" fill="#F472B6" filter="url(#pinkShadow)" />

  <!-- Outer Bumper -->
  <rect x="95" y="45" width="210" height="470" rx="42" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>

  <!-- Inner Body with Lace Overlay -->
  <rect x="100" y="50" width="200" height="460" rx="38" fill="url(#blushBody)"/>
  <rect x="100" y="50" width="200" height="460" rx="38" fill="url(#lacePattern)"/>

  <!-- Buttons -->
  <rect x="91" y="125" width="4" height="26" rx="2" fill="#F472B6"/>
  <rect x="91" y="165" width="4" height="42" rx="2" fill="#F472B6"/>
  <rect x="91" y="215" width="4" height="42" rx="2" fill="#F472B6"/>
  <rect x="305" y="170" width="4" height="54" rx="2" fill="#F472B6"/>

  <!-- Camera Bump Island -->
  <rect x="115" y="65" width="95" height="100" rx="26" fill="#FDF2F8" stroke="#F472B6" stroke-width="2"/>

  <!-- Lenses -->
  <circle cx="145" cy="95" r="17" fill="#18181B" stroke="#F472B6" stroke-width="2"/>
  <circle cx="145" cy="95" r="11" fill="#27272A"/>
  <circle cx="146" cy="94" r="1.5" fill="#FFFFFF" opacity="0.9"/>

  <circle cx="145" cy="135" r="17" fill="#18181B" stroke="#F472B6" stroke-width="2"/>
  <circle cx="145" cy="135" r="11" fill="#27272A"/>
  <circle cx="146" cy="134" r="1.5" fill="#FFFFFF" opacity="0.9"/>

  <circle cx="185" cy="115" r="17" fill="#18181B" stroke="#F472B6" stroke-width="2"/>
  <circle cx="185" cy="115" r="11" fill="#27272A"/>
  <circle cx="186" cy="114" r="1.5" fill="#FFFFFF" opacity="0.9"/>

  <!-- Flash & Sensor -->
  <circle cx="185" cy="85" r="6" fill="#FFFFFF" stroke="#F472B6" stroke-width="1.2"/>
  <circle cx="185" cy="145" r="4.5" fill="#09090B"/>

  <!-- Brand Typography -->
  <text x="200" y="440" text-anchor="middle" font-family="serif" font-size="15" font-weight="600" fill="#9D174D" letter-spacing="2">CASELÉ</text>
  <text x="200" y="456" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="500" fill="#BE185D" opacity="0.75" letter-spacing="3">BLUSH LACE</text>
</svg>
