<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0D0D0D"/><stop offset="100%" style="stop-color:#1a1a1a"/></linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:rgba(255,255,255,0.08)"/><stop offset="50%" style="stop-color:rgba(255,255,255,0.03)"/><stop offset="100%" style="stop-color:rgba(255,255,255,0.06)"/></linearGradient>
    <filter id="sh"><feDropShadow dx="4" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <g transform="translate(200,200) rotate(-8) translate(-160,-200)" filter="url(#sh)">
    <rect x="0" y="0" width="320" height="400" rx="28" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <rect x="6" y="6" width="308" height="388" rx="24" fill="url(#glass)"/>
    <!-- Glass reflection -->
    <rect x="20" y="20" width="3" height="200" rx="1.5" fill="rgba(255,255,255,0.1)"/>
    <rect x="30" y="20" width="2" height="150" rx="1" fill="rgba(255,255,255,0.05)"/>
    <!-- Phone visible through case -->
    <rect x="20" y="20" width="80" height="80" rx="16" fill="#0D0D0D" opacity="0.3"/>
    <circle cx="45" cy="45" r="14" fill="#111" opacity="0.3"/>
    <circle cx="75" cy="45" r="10" fill="#111" opacity="0.3"/>
    <text x="160" y="210" text-anchor="middle" fill="#D4AF37" font-size="14" font-family="Georgia, serif" opacity="0.3">CASELÉ</text>
  </g>
</svg>
