<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800">
  <defs>
    <!-- Subtle shadow for depth -->
    <filter id="shadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <!-- Glossy highlight -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="40%" stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- Phone body -->
  <rect x="60" y="40" width="280" height="720" rx="48" ry="48" 
        fill="#1a1a1a" filter="url(#shadow)"/>

  <!-- Screen -->
  <rect x="68" y="52" width="264" height="696" rx="40" ry="40" 
        fill="#000"/>

  <!-- Dynamic Island -->
  <rect x="152" y="64" width="96" height="28" rx="14" ry="14" 
        fill="#1a1a1a"/>

  <!-- Camera module -->
  <rect x="76" y="60" width="84" height="84" rx="20" ry="20" 
        fill="#222"/>
  <circle cx="104" cy="88" r="14" fill="#111" stroke="#333" stroke-width="2"/>
  <circle cx="104" cy="88" r="8" fill="#0a0a2a"/>
  <circle cx="104" cy="88" r="3" fill="#1a1a3a" opacity="0.6"/>
  <circle cx="136" cy="88" r="14" fill="#111" stroke="#333" stroke-width="2"/>
  <circle cx="136" cy="88" r="8" fill="#0a0a2a"/>
  <circle cx="136" cy="88" r="3" fill="#1a1a3a" opacity="0.6"/>
  <circle cx="104" cy="120" r="14" fill="#111" stroke="#333" stroke-width="2"/>
  <circle cx="104" cy="120" r="8" fill="#0a0a2a"/>
  <circle cx="104" cy="120" r="3" fill="#1a1a3a" opacity="0.6"/>
  <!-- Flash -->
  <circle cx="136" cy="120" r="6" fill="#333"/>

  <!-- Side buttons -->
  <rect x="56" y="180" width="4" height="60" rx="2" fill="#2a2a2a"/>
  <rect x="56" y="280" width="4" height="100" rx="2" fill="#2a2a2a"/>
  <rect x="56" y="420" width="4" height="100" rx="2" fill="#2a2a2a"/>
  <rect x="340" y="300" width="4" height="140" rx="2" fill="#2a2a2a"/>

  <!-- Gloss overlay -->
  <rect x="60" y="40" width="280" height="720" rx="48" ry="48" 
        fill="url(#gloss)"/>

  <!-- Screen content hint (subtle gradient) -->
  <rect x="68" y="52" width="264" height="696" rx="40" ry="40" 
        fill="url(#gloss)" opacity="0.5"/>
</svg>
