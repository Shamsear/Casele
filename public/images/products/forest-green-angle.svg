<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0D0D0D"/><stop offset="100%" style="stop-color:#1a1a1a"/></linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#166534"/><stop offset="50%" style="stop-color:#15803d"/><stop offset="100%" style="stop-color:#14532d"/></linearGradient>
    <filter id="sh"><feDropShadow dx="4" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <g transform="translate(200,200) rotate(-8) translate(-160,-200)" filter="url(#sh)">
    <rect x="0" y="0" width="320" height="400" rx="28" fill="url(#green)"/>
    <rect x="6" y="6" width="308" height="388" rx="24" fill="#15803d" opacity="0.8"/>
    <!-- Leather texture lines -->
    <line x1="20" y1="100" x2="300" y2="100" stroke="#14532d" stroke-width="0.5"/>
    <line x1="20" y1="150" x2="300" y2="150" stroke="#14532d" stroke-width="0.5"/>
    <line x1="20" y1="200" x2="300" y2="200" stroke="#14532d" stroke-width="0.5"/>
    <line x1="20" y1="250" x2="300" y2="250" stroke="#14532d" stroke-width="0.5"/>
    <rect x="20" y="20" width="80" height="80" rx="16" fill="#166534" stroke="#22c55e" stroke-width="0.5" opacity="0.3"/>
    <circle cx="45" cy="45" r="14" fill="#15803d" stroke="#22c55e" stroke-width="0.5" opacity="0.4"/>
    <circle cx="75" cy="45" r="10" fill="#15803d" stroke="#22c55e" stroke-width="0.5" opacity="0.4"/>
    <circle cx="45" cy="75" r="6" fill="#15803d" stroke="#22c55e" stroke-width="0.5" opacity="0.4"/>
    <text x="160" y="210" text-anchor="middle" fill="#D4AF37" font-size="14" font-family="Georgia, serif" opacity="0.4">CASELÉ</text>
  </g>
